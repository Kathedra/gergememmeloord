title: Gereformeerde Gemeente Emmeloord
description: >-
  Website van de Gereformeerde Gemeente te Emmeloord (Moriakerk) —
  kerkdiensten, meeluisteren en contact.
tagline: Kerkdiensten en meeluisteren
lang: nl
locale: nl_NL
timezone: Europe/Amsterdam
logo: /assets/img/logo.svg

# Externe inlogomgeving voor leden (ledenportaal/streamtoegang).
login_url: "https://web.scipio-app.nl/app/#/login"

# Adres en e-mail: één bron voor footer en structured data
# (de contactpagina noemt ze ook, in lopende tekst).
email: scriba@gergememmeloord.nl
address:
  street: Reestdal 25
  postcode: 8302 JW
  city: Emmeloord

# Optionele foto achter de welkomstbanner op de homepage. Pad naar
# een bestand in assets/img/ (bijv. "/assets/img/hero.jpg"), of leeg
# laten voor de bruine gradient. Er komt altijd een donkere overlay
# overheen zodat de tekst leesbaar blijft, ongeacht de foto.
hero_image: "/assets/img/hero.jpg"

# url + baseurl bepalen de canonical-URL's in de SEO-tags en de sitemap.
# Nu: projectsite op GitHub Pages. Bij verhuizing naar het eigen domein:
#   url: "https://gergememmeloord.nl"  en  baseurl: ""
url: "https://kathedra.github.io"
baseurl: "/gergememmeloord"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Standaard voorbeeldafbeelding voor sociale media (og:image, o.a.
# WhatsApp/link-previews) op elke pagina: een 1200x630-uitsnede van de
# herofoto, klein genoeg om overal getoond te worden.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og.jpg

# Tijdelijke aankondigingen op de homepage: markdown-bestanden in
# _mededelingen/ met 'vanaf' en 'tot' in de front matter (zie README).
collections:
  mededelingen:
    output: false
  # Vrij mee te kijken uitzendingen: één knop op de homepage binnen
  # het datumvenster (zie _uitzendingen/voorbeeld.md).
  uitzendingen:
    output: false

# Google Analytics (GA4): vul hier de measurement-ID in
# (G-XXXXXXXXXX, te vinden op analytics.google.com onder
# Beheer → Gegevensstromen → je site). Leeg = geen Analytics.
# Zodra hier een ID staat, verschijnen vanzelf de cookiemelding én de
# uitleg op de privacyverklaring; Analytics laadt pas nadat de
# bezoeker op "Accepteren" heeft geklikt (zie _includes/analytics.html)
# en alleen op de echte site (niet bij lokaal bekijken).
google_analytics: ""

# Cookiemelding: op false staat er geen banner en plaatst de site
# niets — behalve als hierboven een Analytics-ID is ingevuld, dan is
# de melding sowieso nodig en verschijnt hij automatisch. Zet dit op
# true zodra er (ander) cookiegebruik bijkomt; zie _includes/cookies.html
# voor hoe zo'n script pas ná toestemming geladen wordt, en beschrijf
# de cookies in privacyverklaring.md.
cookie_banner: false

# Inhoudsopgaven ({:toc}, o.a. op wat-geloven-wij): alleen h2/h3,
# anders staat de paginatitel (h1) in zijn eigen inhoudsopgave.
kramdown:
  toc_levels: 2..3

# Volledige https-URL van een .ics-feed voor de agenda op de
# dienstenpagina (webcal:// wordt automatisch als https opgehaald).
# Leeg laten = agenda-sectie verborgen.
# Let op: de feed-server moet CORS toestaan
# (Access-Control-Allow-Origin: *), omdat de browser van de bezoeker
# hem rechtstreeks ophaalt.
ical_feed: "https://api.kerktijden.nl/data/kerktijden/gemeente/200/ical"

exclude:
  - README.md
  - BEHEER.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
