<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f6c55">
  {% seo %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/logo.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    // Opgeslagen themakeuze (knop in de footer, zie thema.js) al vóór
    // het tekenen toepassen — anders flitst de pagina eerst licht op
    // voor wie donker gekozen heeft.
    (function () {
      var t;
      try { t = localStorage.getItem("thema"); } catch (e) {}
      if (t === "donker" || t === "licht") {
        document.documentElement.setAttribute("data-thema", t);
      }
    })();
  </script>
  {%- if page.url == "/" and site.hero_image and site.hero_image != "" %}
  <!-- De herofoto is een CSS-achtergrond en wordt anders pas ontdekt
       nadat de stylesheet geladen is — preload haalt hem meteen op. -->
  <link rel="preload" as="image" href="{{ site.hero_image | relative_url }}">
  {%- endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Church",
    "name": {{ site.title | jsonify }},
    "alternateName": "Moriakerk Emmeloord",
    "url": "{{ site.url }}{{ site.baseurl }}/",
    "email": {{ site.email | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ site.address.street | jsonify }},
      "postalCode": {{ site.address.postcode | jsonify }},
      "addressLocality": {{ site.address.city | jsonify }},
      "addressCountry": "NL"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 52.7176,
      "longitude": 5.7455
    },
    "sameAs": [
      "https://www.kerktijden.nl/gemeente/200/emmeloord-geref-gem-moriakerk"
    ],
    "image": "{{ '/assets/img/og.jpg' | absolute_url }}"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#inhoud">Direct naar de inhoud</a>
  {% include header.html %}
  <main id="inhoud" class="site-main">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
