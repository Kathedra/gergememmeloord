<header class="site-header">
  <div class="header-bar">
    <a class="logo" href="{{ '/' | relative_url }}" aria-label="Naar de startpagina">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="108" height="108">
    </a>
    <p class="site-title">{{ site.title }}</p>
  </div>
  <nav class="site-nav" aria-label="Hoofdmenu">
    {% assign nav_items = "Home|/;Diensten|/diensten/;Meeluisteren|/meeluisteren/;Contact|/contact/" | split: ";" %}
    {% for item in nav_items %}
      {% assign parts = item | split: "|" %}
      <a href="{{ parts[1] | relative_url }}"{% if page.url == parts[1] %} class="active" aria-current="page"{% endif %}>{{ parts[0] }}</a>
    {% endfor %}
  </nav>
</header>
