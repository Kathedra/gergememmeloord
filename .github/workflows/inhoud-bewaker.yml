# Bewaakt dat echte inhoud (mededelingen, uitzendingen, foto's) niet
# per ongeluk meelift op een codebranch. Testinhoud mag wél: die draagt
# 'published: false' en is daardoor op de echte site onzichtbaar, maar
# staat wel in de preview (die bouwt met --unpublished).
#
# Slaagt dus als:
#   - de tak van het formulier komt (formulier/**), of
#   - er niets in die mappen gewijzigd is, of
#   - alle gewijzigde bestanden 'published: false' hebben, of
#   - de pull request het label 'inhoud-ok' draagt (bewuste uitzondering).
#
# Bedoeld als verplichte check op main; daarom draait de job altijd en
# stopt hij vanbinnen — een overgeslagen job blijft anders eeuwig
# "in afwachting" staan bij de merge-knop.
name: Inhoud bewaken

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  bewaken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gewijzigde inhoud controleren
        env:
          TAK: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ "$TAK" == formulier/* ]]; then
            echo "Inzending van het formulier — inhoud hoort hier thuis."
            exit 0
          fi
          if [[ ",$LABELS," == *",inhoud-ok,"* ]]; then
            echo "Label 'inhoud-ok' staat erop; bewust toegestaan."
            exit 0
          fi

          git fetch origin main
          gewijzigd=$(git diff --name-only origin/main...HEAD -- \
            _mededelingen _uitzendingen assets/img/mededelingen)

          if [ -z "$gewijzigd" ]; then
            echo "Geen inhoud gewijzigd."
            exit 0
          fi

          fout=0
          while IFS= read -r bestand; do
            [ -n "$bestand" ] || continue
            case "$bestand" in
              */voorbeeld.md)
                echo "OK   $bestand (voorbeeldbestand)"
                continue
                ;;
            esac

            # Verwijderd of een foto: dan kan er geen 'published: false'
            # in staan, dus dat is altijd echte inhoud.
            if [ ! -f "$bestand" ]; then
              echo "FOUT $bestand (verwijderd op een codebranch)"
              fout=1
            elif [[ "$bestand" == *.md ]] && grep -qE '^published:[[:space:]]*false[[:space:]]*$' "$bestand"; then
              echo "OK   $bestand (testinhoud, published: false)"
            else
              echo "FOUT $bestand (echte inhoud)"
              fout=1
            fi
          done <<< "$gewijzigd"

          if [ "$fout" -eq 1 ]; then
            echo ""
            echo "::error::Deze pull request wijzigt echte inhoud op een codebranch."
            echo "Zet 'published: false' in testbestanden, of laat de wijziging via het"
            echo "formulier lopen. Is het toch de bedoeling? Zet dan het label 'inhoud-ok'"
            echo "op deze pull request."
            exit 1
          fi

          echo "Alleen testinhoud gewijzigd — prima."
